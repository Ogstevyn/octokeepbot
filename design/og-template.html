<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
html,body{margin:0;width:1200px;height:630px;background:#000;font-family:var(--font-sans);color:var(--text)}
.c{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.c:before{content:"";position:absolute;inset:24px;border:1px solid #2b2b2b;border-radius:28px;background:#0c0c0c;z-index:0}
.c>*{position:relative;z-index:1}
.wm{display:flex;align-items:center;gap:16px}
.wm img{width:64px;height:64px}
.wm span{display:flex;flex-direction:column;font-weight:700;font-size:34px;line-height:.92;letter-spacing:-.035em}
.wm span b{font-weight:450;background:var(--brand-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:0;font-size:72px;line-height:1;letter-spacing:-.05em;font-weight:700;max-width:760px}
p{margin:0;color:#a3a3a3;font-size:28px}
.handle{display:inline-block;margin-top:18px;padding:8px 14px;border-radius:8px;background:#262626;color:#dcdcd7;font-family:var(--font-mono);font-size:22px}
.m{position:absolute;right:56px;bottom:40px;width:340px;height:340px;z-index:1}
</style></head><body><div class="c">
<div class="wm"><img src="/images/logo-96.webp"><span>octo<b>keep</b></span></div>
<div><h1>Stop bookmarking.<br>Start doing.</h1><p style="margin-top:20px">Send a link. Get the summary. Get reminded.</p><span class="handle">@OctoKeep_bot</span></div>
</div><img class="m" src="/images/mascot-520.webp"></body></html>
